  <script>
    // =====================================
    // SUPABASE
    // =====================================

    const SUPABASE_URL = 'https://jihpgbsghatuwwkacsur.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImppaHBnYnNnaGF0dXd3a2Fjc3VyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxMzkxNzcsImV4cCI6MjA5MzcxNTE3N30.qH7iso7t2zoOLi0C68DiUKZecyIDhlxVcJAcNhYLHTk';

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


    // =====================================
    // SERVICES
    // =====================================

    const SERVICES = [
      {
        name: 'MagicByte ICT Cloud',
        icon: '☁️',
        url: 'https://cloud.example.com'
      },
      {
        name: 'UK Television Clips',
        icon: '📺',
        url: 'https://tv.example.com'
      },
      {
        name: 'United Broadcasting Company',
        icon: '🏢',
        url: 'https://ubc.example.com'
      },
      {
        name: 'Plum Courses',
        icon: '📚',
        url: 'https://courses.example.com'
      }
    ];


    // =====================================
    // PASSWORD STRENGTH
    // =====================================

    function checkPasswordStrength() {
      const password = document.getElementById('password').value;

      const bar = document.getElementById('strength-bar');
      const text = document.getElementById('strength-text');

      let strength = 0;

      if (password.length >= 8) strength++;
      if (/[A-Z]/.test(password)) strength++;
      if (/[0-9]/.test(password)) strength++;
      if (/[^A-Za-z0-9]/.test(password)) strength++;

      const widths = ['0%', '25%', '50%', '75%', '100%'];
      const labels = ['Very Weak', 'Weak', 'Medium', 'Strong', 'Very Strong'];

      bar.style.width = widths[strength];
      text.innerText = labels[strength];
    }


    // =====================================
    // RENDER SERVICES
    // =====================================

    function renderServices() {
      const container = document.getElementById('services-container');

      SERVICES.forEach(service => {
        const item = document.createElement('label');

        item.className = 'bg-black/20 border border-white/10 rounded-3xl p-5 flex items-center justify-between gap-5 cursor-pointer hover:bg-white/10 transition-all';

        item.innerHTML = `
          <div class="flex items-center gap-4">
            <div class="text-3xl">${service.icon}</div>

            <div>
              <h3 class="text-xl font-black leading-tight">
                ${service.name}
              </h3>

              <p class="text-purple-200 text-sm mt-1">
                Enable access through Plum Identity.
              </p>
            </div>
          </div>

          <input
            type="checkbox"
            class="service-checkbox w-6 h-6"
            data-name="${service.name}"
            data-icon="${service.icon}"
            data-url="${service.url}"
          />
        `;

        container.appendChild(item);
      });
    }


    // =====================================
    // CREATE ACCOUNT
    // =====================================

    async function createAccount() {
      const status = document.getElementById('signup-status');

      status.innerText = 'Creating account...';

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      if (password !== confirmPassword) {
        status.innerText = 'Passwords do not match';
        return;
      }

      const {
        data,
        error
      } = await supabaseClient.auth.signUp({
        email,
        password
      });

      if (error) {
        console.error(error);
        status.innerText = error.message;
        return;
      }

      const user = data.user;

      if (!user) {
        status.innerText = 'Failed to create account';
        return;
      }

      // =====================================
      // INSERT ENABLED SERVICES
      // =====================================

      const selectedServices = [];

      document.querySelectorAll('.service-checkbox').forEach(box => {
        if (box.checked) {
          selectedServices.push({
            user_id: user.id,
            service_name: box.dataset.name,
            service_icon: box.dataset.icon,
            service_url: box.dataset.url,
            enabled: true
          });
        }
      });

      if (selectedServices.length > 0) {
        const { error: servicesError } = await supabaseClient
          .from('user_services')
          .insert(selectedServices);

        if (servicesError) {
          console.error(servicesError);
        }
      }

      status.innerText = 'Account created successfully';

      setTimeout(() => {
        window.location.href = 'portal.html';
      }, 1500);
    }


    // =====================================
    // START APP
    // =====================================

    window.addEventListener('load', renderServices);
  </script>
