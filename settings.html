<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plum Identity Settings</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Inter, sans-serif;
    }
  </style>

</head>

<body class="min-h-screen bg-gradient-to-br from-[#12051f] via-[#24053a] to-[#3f0a5a] text-white overflow-x-hidden">

  <!-- BACKGROUND -->

  <div class="fixed inset-0 overflow-hidden pointer-events-none opacity-30">
    <div class="absolute top-0 left-0 w-96 h-96 bg-pink-500 rounded-full blur-3xl"></div>
    <div class="absolute bottom-0 right-0 w-[30rem] h-[30rem] bg-purple-500 rounded-full blur-3xl"></div>
  </div>

  <script>
    // =====================================
    // SUPABASE CONFIG
    // =====================================

    const SUPABASE_URL = 'https://jihpgbsghatuwwkacsur.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImppaHBnYnNnaGF0dXd3a2Fjc3VyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxMzkxNzcsImV4cCI6MjA5MzcxNTE3N30.qH7iso7t2zoOLi0C68DiUKZecyIDhlxVcJAcNhYLHTk';

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    let currentUser = null;


    // =====================================
    // SERVICE DEFINITIONS
    // EASY COPY + PASTE FORMAT
    // =====================================

    const SERVICES = [
      {
        name: 'MagicByte ICT Cloud',
        icon: '☁️',
        url: 'https://cloud.ict.magicplum.co.uk'
      },
      {
        name: 'UK Television Clips',
        icon: '📺',
        url: 'https://uktvc.magicplum.co.uk'
      },
      {
        name: 'United Broadcasting Company',
        icon: '🏢',
        url: 'https://ubc.anarchygroup.uk'
      },
      {
        name: 'Plum Courses',
        icon: '📚',
        url: 'https://academy.magicplum.co.uk/courses'
      }
    ];


    // =====================================
    // INITIALIZE
    // =====================================

    async function initializeSettings() {
      const {
        data: { user },
        error
      } = await supabaseClient.auth.getUser();

      if (error || !user) {
        window.location.href = 'index.html';
        return;
      }

      currentUser = user;

      document.getElementById('user-email').innerText = user.email;

      await ensureProfileExists();
      await loadProfile();
      await loadServices();
    }


    // =====================================
    // ENSURE PROFILE EXISTS
    // =====================================

    async function ensureProfileExists() {
      const { data } = await supabaseClient
        .from('user_profiles')
        .select('id')
        .eq('id', currentUser.id)
        .maybeSingle();

      if (!data) {
        await supabaseClient
          .from('user_profiles')
          .insert({
            id: currentUser.id,
            display_name: currentUser.email.split('@')[0],
            mfa_enabled: true
          });
      }
    }


    // =====================================
    // PROFILE LOADING
    // =====================================

    async function loadProfile() {
      const { data, error } = await supabaseClient
        .from('user_profiles')
        .select('*')
        .eq('id', currentUser.id)
        .single();

      if (error) {
        console.error(error);
        return;
      }

      document.getElementById('display-name').value = data.display_name || '';

      document.getElementById('mfa-toggle').checked = data.mfa_enabled ?? true;
    }


    // =====================================
    // SAVE PROFILE
    // =====================================

    async function saveProfile() {
      const status = document.getElementById('profile-status');

      status.innerText = 'Saving settings...';

      const { error } = await supabaseClient
        .from('user_profiles')
        .update({
          display_name: document.getElementById('display-name').value,
          mfa_enabled: document.getElementById('mfa-toggle').checked
        })
        .eq('id', currentUser.id);

      if (error) {
        console.error(error);
        status.innerText = 'Failed to save settings';
        return;
      }

      status.innerText = 'Settings saved successfully';
    }


    // =====================================
    // LOAD SERVICES
    // =====================================

    async function loadServices() {
      const container = document.getElementById('services-container');

      container.innerHTML = '';

      const { data, error } = await supabaseClient
        .from('user_services')
        .select('*')
        .eq('user_id', currentUser.id);

      if (error) {
        console.error(error);
        return;
      }

      SERVICES.forEach(service => {
        const enabled = data.some(s => s.service_name === service.name && s.enabled === true);

        const card = document.createElement('div');

        card.className = 'bg-black/20 border border-white/10 rounded-3xl p-6';

        card.innerHTML = `
          <div class="flex items-start justify-between gap-5">

            <div>
              <div class="text-4xl mb-4">${service.icon}</div>

              <h3 class="text-2xl font-black leading-tight">
                ${service.name}
              </h3>

              <p class="text-purple-200 mt-3 text-sm leading-relaxed">
                Enable access to ${service.name} through Plum Identity.
              </p>
            </div>

            <label class="relative inline-flex items-center cursor-pointer">
              <input
                type="checkbox"
                class="sr-only peer"
                ${enabled ? 'checked' : ''}
                onchange="toggleService('${service.name}', '${service.icon}', '${service.url}', this.checked)"
              >

              <div class="w-14 h-8 bg-white/10 peer-focus:outline-none rounded-full peer peer-checked:bg-pink-500 transition-all"></div>

              <div class="absolute left-1 top-1 bg-white w-6 h-6 rounded-full transition-all peer-checked:translate-x-6"></div>
            </label>

          </div>
        `;

        container.appendChild(card);
      });
    }


    // =====================================
    // TOGGLE SERVICES
    // =====================================

async function toggleService(name, icon, url, enabled) {
  const status =
    document.getElementById('services-status');

  status.innerText = 'Updating services...';

  if (enabled) {

    const { error } = await supabaseClient
      .from('user_services')
      .upsert(
        {
          user_id: currentUser.id,
          service_name: name,
          service_icon: icon,
          service_url: url,
          enabled: true
        },
        {
          onConflict: 'user_id,service_name'
        }
      );

    if (error) {
      console.error(error);

      status.innerText =
        'Failed to enable service';

      return;
    }

  } else {

    const { error } = await supabaseClient
      .from('user_services')
      .delete()
      .eq('user_id', currentUser.id)
      .eq('service_name', name);

    if (error) {
      console.error(error);

      status.innerText =
        'Failed to disable service';

      return;
    }
  }

  status.innerText =
    'Services updated successfully';
}


    // =====================================
    // SIGN OUT
    // =====================================

    async function signOut() {
      await supabaseClient.auth.signOut();
      window.location.href = 'index.html';
    }


    // =====================================
    // START APP
    // =====================================

    window.addEventListener('load', initializeSettings);
  </script>

  <!-- HEADER -->

  <header class="relative z-20 border-b border-white/10 bg-black/20 backdrop-blur-xl">
    <div class="max-w-7xl mx-auto px-6 py-5 flex items-center justify-between">

  <div class="flex items-center gap-4">
    <div class="w-14 h-14 rounded-3xl bg-gradient-to-br from-pink-400 to-purple-600 flex items-center justify-center text-2xl font-black shadow-2xl">
      P
    </div>

    <div>
      <h1 class="text-2xl font-black">Plum Identity Settings</h1>
      <p class="text-sm text-purple-200">
        Core ecosystem preferences
      </p>
    </div>
  </div>

  <div class="flex items-center gap-4">

    <div class="hidden md:block text-right">
      <p class="text-xs uppercase tracking-wider text-purple-300">
        Signed In As
      </p>

      <p id="user-email" class="font-bold"></p>
    </div>

    <a href="portal.html">
      <button class="px-5 py-3 rounded-2xl bg-white/10 border border-white/10 hover:bg-white/20 transition-all">
        Back To Portal
      </button>
    </a>

    <button
      onclick="signOut()"
      class="px-5 py-3 rounded-2xl bg-red-500/20 border border-red-400/20 hover:bg-red-500/30 transition-all"
    >
      Sign Out
    </button>

  </div>

</div>

  </header>

  <!-- MAIN -->

  <main class="relative z-10 max-w-7xl mx-auto px-6 py-12 space-y-10">

<!-- ACCOUNT SETTINGS -->
<section class="bg-white/5 border border-white/10 rounded-[2rem] p-8 backdrop-blur-xl shadow-2xl">

  <h2 class="text-4xl font-black">
    Account Settings
  </h2>

  <p class="text-purple-200 mt-3">
    Manage your display name and security preferences.
  </p>

  <div class="grid md:grid-cols-2 gap-8 mt-10">

    <div>
      <label class="block text-sm text-purple-300 mb-3">
        Display Name
      </label>

      <input
        id="display-name"
        type="text"
        placeholder="Display Name"
        class="w-full px-5 py-4 rounded-2xl bg-black/20 border border-white/10 outline-none"
      />
    </div>

    <div class="bg-black/20 border border-white/10 rounded-3xl p-6 flex items-center justify-between">

      <div>
        <h3 class="text-2xl font-black">
          Multi-Factor Authentication
        </h3>

        <p class="text-purple-200 mt-2 text-sm leading-relaxed">
          Additional account protection enabled by default.
        </p>
      </div>

      <label class="relative inline-flex items-center cursor-pointer">
        <input
          id="mfa-toggle"
          type="checkbox"
          class="sr-only peer"
        >

        <div class="w-14 h-8 bg-white/10 peer-focus:outline-none rounded-full peer peer-checked:bg-pink-500 transition-all"></div>

        <div class="absolute left-1 top-1 bg-white w-6 h-6 rounded-full transition-all peer-checked:translate-x-6"></div>
      </label>

    </div>

  </div>

  <div class="mt-10 flex items-center gap-5 flex-wrap">

    <button
      onclick="saveProfile()"
      class="px-8 py-4 rounded-2xl bg-gradient-to-r from-pink-500 to-purple-600 font-bold shadow-2xl hover:scale-[1.02] transition-all"
    >
      Save Account Settings
    </button>

    <p id="profile-status" class="text-purple-200"></p>

  </div>

</section>


<!-- SERVICES -->
<section class="bg-white/5 border border-white/10 rounded-[2rem] p-8 backdrop-blur-xl shadow-2xl">

  <h2 class="text-4xl font-black">
    Services
  </h2>

  <p class="text-purple-200 mt-3">
    Enable and disable connected ecosystem services.
  </p>

  <div
    id="services-container"
    class="grid md:grid-cols-2 gap-8 mt-10"
  >
  </div>

  <div class="mt-8">
    <p id="services-status" class="text-purple-200"></p>
  </div>

</section>

  </main>

</body>
</html>
